<html><head><style>
body{margin:0;background:#fff;font-family:Inter,Arial,sans-serif}
text{font-family:Inter,Arial,sans-serif}
.t{font-size:15px;font-weight:700;fill:#1e1b4b}.s{font-size:12px;fill:#3b3a58}.h{font-size:13px;font-weight:700;fill:#6d28d9;letter-spacing:.06em}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<!-- lanes -->
<rect x="20" y="20" width="760" height="720" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
<text x="40" y="48" class="h">EVERY CHAT TURN (Vercel: static portal + one Python function, FastAPI)</text>
<rect x="800" y="20" width="380" height="420" rx="18" fill="#f0f9ff" stroke="#bae6fd"/>
<text x="820" y="48" class="h" style="fill:#0369a1">BUILT ONCE, OFFLINE (on the college PC)</text>
<rect x="800" y="460" width="380" height="280" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="820" y="488" class="h" style="fill:#047857">EXTERNAL SERVICES</text>
<g id="boxes">
<!-- main flow -->
<rect x="60" y="68" width="680" height="54" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="80" y="92" class="t">1. Employee in the React portal (Ask Nia)</text><text x="80" y="111" class="s">message + recent history + profile (grade, location); demo sign-in only; AI disclosure and banner</text>
<rect x="60" y="140" width="680" height="54" rx="12" fill="#fff" stroke="#f43f5e" stroke-width="2"/>
<text x="80" y="164" class="t">2. Limits and regex safety screen (no model call)</text><text x="80" y="183" class="s">800 chars, 20 turns, per-IP limit; distress, injection, other people's data, escalations (POSH, pay, discrimination...)</text>
<rect x="60" y="212" width="330" height="54" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="80" y="236" class="t">3a. Tools (no model call)</text><text x="80" y="255" class="s">leave balance (demo CSV), create / check ticket</text>
<rect x="410" y="212" width="330" height="54" rx="12" fill="#fff" stroke="#f43f5e" stroke-width="1.5"/>
<text x="430" y="236" class="t">3b. Hand-off to a person</text><text x="430" y="255" class="s">contacts + ticket offer; POSH: process only</text>
<rect x="60" y="284" width="680" height="54" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="80" y="308" class="t">4. Follow-up rewrite, then answer cache</text><text x="80" y="327" class="s">clean swaps by rules ("what about L7?"); other follow-ups rewritten by the model; cache keyed on question + profile</text>
<rect x="60" y="356" width="680" height="72" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
<text x="80" y="380" class="t">5. Hybrid retrieval over 386 chunks</text><text x="80" y="399" class="s">BM25 top 30 + dense top 30 (bge-small) + reranker (MiniLM, int8) fused by RRF; grade/location/leave boosts;</text><text x="80" y="416" class="s">amending circulars and "Clause X prevails" targets always added; best 8 chunks + confidence score</text>
<rect x="60" y="446" width="680" height="54" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<text x="80" y="470" class="t">6. Confidence gate</text><text x="80" y="489" class="s">below the threshold (0.0011): "not found" + ticket offer, and the model is never called</text>
<rect x="60" y="518" width="680" height="54" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="80" y="542" class="t">7. Answer model in JSON mode (at most 2 model calls per turn)</text><text x="80" y="561" class="s">labelled sources [S1]..[S8], strict rules; Ollama gpt-oss:120b, then Gemini models on failure; 30 s timeout</text>
<rect x="60" y="590" width="680" height="72" rx="12" fill="#fff" stroke="#10b981" stroke-width="2"/>
<text x="80" y="614" class="t">8. Post-verification in code</text><text x="80" y="633" class="s">drop invented labels; check each cited snippet on the PDF page; remove sentences whose numbers are in no cited</text><text x="80" y="650" class="s">source; uncited answer becomes "not found"; circular conflicts added from metadata</text>
<rect x="60" y="680" width="680" height="44" rx="12" fill="#4f46e5"/>
<text x="80" y="708" class="t" style="fill:#fff">9. Reply: answer, page citations, conflicts, route badge, follow-ups; anonymised log</text>
<!-- offline -->
<rect x="820" y="68" width="340" height="62" rx="12" fill="#fff" stroke="#0ea5e9"/>
<text x="836" y="92" class="t">YAML policy sources</text><text x="836" y="112" class="s">9 documents, 36 planted traps, 20 circulars</text>
<rect x="820" y="150" width="340" height="62" rx="12" fill="#fff" stroke="#0ea5e9"/>
<text x="836" y="174" class="t">ReportLab: 9 PDFs, 134 pages</text><text x="836" y="194" class="s">TOC, footers and traps verified by script</text>
<rect x="820" y="232" width="340" height="80" rx="12" fill="#fff" stroke="#0ea5e9"/>
<text x="836" y="256" class="t">Ingestion (reads the PDFs only)</text><text x="836" y="276" class="s">pdfplumber, clause/table/circular chunking,</text><text x="836" y="294" class="s">page numbers checked 386/386</text>
<rect x="820" y="332" width="340" height="80" rx="12" fill="#fff" stroke="#0ea5e9"/>
<text x="836" y="356" class="t">Index in the repo (2.5 MB)</text><text x="836" y="376" class="s">chunks + metadata, BM25 tokens, vectors;</text><text x="836" y="394" class="s">ONNX models bundled (87 MB)</text>
<!-- external -->
<rect x="820" y="506" width="340" height="62" rx="12" fill="#fff" stroke="#10b981"/>
<text x="836" y="530" class="t">Ollama cloud: gpt-oss:120b</text><text x="836" y="550" class="s">main model; Gemini free tier as fallback</text>
<rect x="820" y="588" width="340" height="62" rx="12" fill="#fff" stroke="#10b981"/>
<text x="836" y="612" class="t">Upstash Redis (free)</text><text x="836" y="632" class="s">tickets, answer cache, anonymised logs</text>
<rect x="820" y="670" width="340" height="54" rx="12" fill="#fff" stroke="#10b981"/>
<text x="836" y="694" class="t">GitHub, then Vercel</text><text x="836" y="712" class="s">a push redeploys the whole site</text>
</g>
