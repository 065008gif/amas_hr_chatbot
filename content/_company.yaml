  "009": {title: "IT, Information Security and Acceptable Use Policy", number: NTL/HR/POL/009, target_pages: 16, file: pol009_itsecurity.yaml}

# Policy hierarchy that every document restates in its own words (so the bot can explain which prevails):
precedence:
  - "Applicable law (a statute prevails over any weaker company rule)"
  - "An amendment circular, from its effective date, over the body clause it amends"
  - "The specific policy on a subject over the Employee Handbook (the Handbook is a summary)"
  - "Between two policies, the one that governs the subject matter (e.g. Separation Policy for notice periods)"

# Deliberate cross-document conflicts (trap type 2). Filled in as documents are written; each must
# name both sides and which one prevails under `precedence`, and each gets a trap in content/traps.yaml.
planned_conflicts:
  - id: C01
    subject: Paternity leave duration
    side_a: "001 Leave Policy, Circular HR/CIR/2025/07: 10 Working Days within six months (from 1 July 2025)"
    side_b: "002 Employee Handbook (to be written): summary still states 5 Working Days within three months"
    prevails: "001 (specific policy over the Handbook summary, and circular over body; 001 Clause 1.4)"
  - id: C02
    subject: Earned Leave encashment limit on separation
    side_a: "001 Leave Policy Clause 11.2: encashed up to the Grade accumulation limit in Table 1 (45 or 60 days; 30 for L1)"
    side_b: "008 Separation and Exit Policy (to be written): full and final settlement text states a limit of 30 days"
    prevails: "001, by 001 Clause 11.5 and Clause 1.4 (Leave Policy governs leave encashment)"

  - id: C03
    subject: Time limit for raising a sexual harassment complaint
    side_a: "003 POSH Policy: within three months of the incident, extendable by a further three months (statutory)"
    side_b: "004 Code of Conduct: grievances including harassment to be raised within 30 days"
    prevails: "003 and the statute (POSH Act); a statute prevails over a weaker company rule"
  - id: C04
    subject: Notice period for Grade L5
    side_a: "008 Separation and Exit Policy: 90 days for Grades L5 to L8"
    side_b: "002 Employee Handbook summary: 60 days for Grade L5"
    prevails: "008 (the policy governing notice periods, over the Handbook summary)"

