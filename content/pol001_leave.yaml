  - id: D
    title: Frequently Asked Questions and Illustrations
    body:
      - para: "The answers below illustrate the application of this Policy. Where an answer and a clause of the Policy appear to differ, the clause prevails, save that the carve-out in {ref:#D.6} forms part of this Policy."
      - clause: "D.1"
        title: How is the sandwich rule applied?
        text: "An Employee takes EL from Thursday to the following Tuesday. The spell covers four Working Days (Thursday, Friday, Monday and Tuesday), which is fewer than five, so the intervening Saturday and Sunday are not counted and four days of EL are debited. If the same Employee takes EL from Thursday to the following Wednesday, the spell covers five Working Days, so the Saturday and Sunday are counted and seven days of EL are debited under {ref:#3.4}."
      - clause: "D.2"
        title: How is leave prorated for a new joiner?
        text: "An Employee in Grade L3 joins on 10 August. Having joined on or before the 15th, the Employee receives EL credit from August: eight months at 1.5 days a month, or 12 days by 31 March. CL is prorated as 7 multiplied by 8/12, or 4.67 days, rounded to 4.5 days; SL is prorated as 8 multiplied by 8/12, or 5.33 days, rounded to 5.5 days."
      - clause: "D.3"
        title: How is EL encashed on separation?
        text: "An Employee in Grade L5 with a Basic Salary of Rs. 60,000 a month resigns with an EL balance of 52 days. The accumulation limit for L5 is 45 days, so 45 days are encashed: Rs. 60,000 divided by 26, multiplied by 45, which is Rs. 1,03,846. The remaining seven days lapse."
      - clause: "D.4"
        title: Can I take bereavement leave on the death of a grandparent or parent-in-law?
        text: "No. Bereavement leave under {ref:#7.1} applies only to the Immediate Family as defined in {ref:#2.8}, which does not include grandparents or parents-in-law. CL or EL may be used instead, and the Reporting Manager is expected to approve it at short notice."
      - clause: "D.5"
        title: My team works on Saturdays for a client. Do Saturdays count as Working Days for my leave?
        text: "No. Under {ref:#2.14}, Saturdays and Sundays are never Working Days for the purposes of this Policy, even under a client roster. Work on a Saturday may qualify for compensatory off under {ref:#7.3} if the Employee is in Grades L1 to L4."
      - clause: "D.6"
        title: Can an Employee in Grade L4 take a sabbatical?
        text: "Ordinarily no, because {ref:#8.3} limits sabbatical to Grade L5 and above. However, an Employee in Grade L4 with at least five years of Continuous Service who has been admitted to a full-time postgraduate programme sponsored by the Company may be granted a sabbatical of up to six months with the approval of the Business Unit Head and the Chief People Officer. This carve-out does not extend to Grades L1 to L3."
      - clause: "D.7"
        title: Can I encash EL during service if I am in Grade L2?
        text: "No. Encashment during service is available only in Grades L3 to L8 under {ref:#4.4}. An Employee in Grade L2 may carry forward EL up to 45 days, and the balance within that limit is encashed on separation under {ref:#11.2}."

circulars_intro: "The circulars below are issued under {ref:#1.6}. Each circular prevails over the clause it amends from its effective date. The body of the Policy above is reproduced unedited and must be read with these circulars."

circulars:
  - number: HR/CIR/2025/07
    date: "2025-06-20"
    effective_from: "2025-07-01"
    subject: Enhancement of paternity leave
    amends: ["6.4.1", "6.4.2"]
    issued_by: Chief People Officer
    body:
      - para: "With effect from 1 July 2025, paternity leave under {ref:#6.4.1} is increased from 5 Working Days to 10 Working Days, to be availed within six months of the date of birth or adoption. The limit of two children during service continues to apply."
      - para: "Notwithstanding {ref:#6.4.2}, paternity leave may be taken in up to two spells within the six-month period."
      - items:
          - "This Circular applies where the date of birth or adoption is on or after 1 July 2025. Where the date of birth or adoption is before 1 July 2025, the entitlement remains 5 Working Days within three months."
          - "All other provisions of the Policy remain unchanged. This Circular prevails over the body of the Policy to the extent of any inconsistency."

  - number: HR/CIR/2025/11
    date: "2025-09-12"
    effective_from: "2025-10-01"
    subject: Combination of Casual Leave with Earned Leave
    amends: ["3.5", "5.2"]
    issued_by: Chief People Officer
    body:
      - para: "With effect from 1 October 2025, Casual Leave may be prefixed or suffixed to Earned Leave, provided that the combined spell does not exceed 10 Working Days. The CL portion is debited to CL and the EL portion to EL, and the sandwich rule in {ref:#3.4} is applied to the combined spell as if it were a spell of EL."
      - para: "CL still may not be combined with Sick Leave. {ref:#3.5} and {ref:#5.2} stand amended accordingly."

  - number: HR/CIR/2026/02
    date: "2026-01-20"
    effective_from: "2026-02-01"
    subject: Revision of bereavement leave
    amends: ["7.1"]
    issued_by: Chief People Officer
    body:
      - para: "With effect from 1 February 2026, bereavement leave under {ref:#7.1} is increased from 3 Working Days to 5 Working Days, to be availed within 15 Calendar Days of the death."
      - para: "The definition of Immediate Family in {ref:#2.8} is not changed by this Circular. Bereavement leave therefore continues to be unavailable on the death of a grandparent, sibling or parent-in-law."
