            - ["Employees' State Insurance", "Gross wages up to the threshold", "0.75 per cent employee and 3.25 per cent employer contribution", "Group medical insurance also provided"]
            - ["Gratuity", "Five years' continuous service, or death or disablement", "Fifteen days' wages per year, subject to the ceiling; paid within 30 days", "Paid within 30 days irrespective of the settlement date"]
            - ["Statutory bonus", "Salary or wage up to the eligibility limit", "8.33 to 20 per cent", "Paid in addition to variable pay"]
            - ["Maternity benefit", "Women meeting the eligibility condition", "Up to 26 weeks' paid leave", "Full salary paid; ESI benefit topped up"]
  - id: E
    title: Insurance Claim Checklist
    body:
      - table:
