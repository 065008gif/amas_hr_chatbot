            - ["Discharge summary", "Hospitalisation", "Signed by the treating doctor"]
            - ["Investigation reports and prescriptions", "All claims", "Including pre-hospitalisation (30 days) and post-hospitalisation (60 days) expenses"]
            - ["Cancelled cheque of the Employee", "Reimbursement claims", "For payment by bank transfer"]
            - ["First information report or medico-legal certificate", "Accident cases", "Where one was registered"]

  - id: F
    title: Tax Treatment of Pay Components
    body:
      - para: "The table below is a general guide to the income tax treatment of each component as applied by Payroll. Tax law changes each year and the individual position depends on the regime chosen; Employees should consult their own tax advisor."
      - table:
          id: Table 11
          title: Tax treatment of pay components
          header: ["Component", "Old tax regime", "New tax regime"]
          widths: [2.4, 3, 3]
          rows:
            - ["Basic Salary, special allowance, communication allowance", "Taxable", "Taxable"]
            - ["House rent allowance", "{stat:IT_HRA_EXEMPT|Partly exempt, as computed under the HRA rules}", "Fully taxable"]
            - ["Leave travel allowance", "{stat:IT_LTA|Exempt for eligible journeys, two in a block of four years}", "Fully taxable"]
            - ["Meal card", "{stat:IT_MEAL_VOUCHER|Exempt within the per-meal limit}", "Treated as per the rules applicable to the regime"]
            - ["Employer provident fund contribution", "{stat:IT_PF_LIMIT|Not taxable up to the prescribed limit}", "Not taxable up to the prescribed limit"]
            - ["Employer NPS contribution", "{stat:IT_80CCD2|Deductible within the limit}", "Deductible within the limit"]
            - ["Variable pay, awards, joining and retention bonus", "Taxable in the year paid", "Taxable in the year paid"]
            - ["ESOP exercise", "{stat:IT_ESOP_PERQ|Perquisite on exercise}", "Perquisite on exercise"]
            - ["Gratuity on leaving", "{stat:IT_GRATUITY_EXEMPT|Exempt up to the statutory limit}", "Exempt up to the statutory limit"]
            - ["Leave encashment on separation", "{stat:IT_LEAVE_ENCASH|Exempt up to the notified limit}", "Exempt up to the notified limit"]

circulars_intro: "The circulars below amend this Policy with the approval of the Chief People Officer and the Chief Financial Officer. Each prevails over the clause it amends from its effective date; the body is reproduced unedited."

circulars:
  - number: HR/CIR/2025/03
    date: "2025-03-10"
    effective_from: "2025-04-01"
    subject: Extension of employer NPS contribution to Grades L3 and L4
    amends: ["11.1", "Table 1"]
    issued_by: Chief People Officer and Chief Financial Officer
    body:
      - para: "With effect from 1 April 2025, the option of an employer contribution to the National Pension System under {ref:#11.1} is extended to Employees in Grades L3 and L4, on the same terms as for Grades L5 to L8. Employees in Grades L1 and L2 remain ineligible. {ref:#Table 1} stands amended accordingly."

  - number: HR/CIR/2025/06
    date: "2025-06-05"
    effective_from: "2025-07-01"
    subject: Revision of group medical sum insured for Grades L1 to L3
    amends: ["9.2", "Table 4"]
    issued_by: Chief People Officer
    body:
      - para: "With effect from the policy renewal on 1 July 2025, the family floater sum insured under the group medical insurance for Employees in Grades L1 to L3 is increased from Rs. 3,00,000 to Rs. 4,00,000. The room rent limit remains 1 per cent of the sum insured per day, that is, Rs. 4,000 per day."
      - para: "The sum insured for Grades L4 to L8 in {ref:#Table 4} is unchanged."

  - number: HR/CIR/2026/05
    date: "2026-04-10"
    effective_from: "2026-04-15"
    subject: Leave condition for LTA claims
    amends: ["12.2"]
    issued_by: Head, Total Rewards
    body:
      - para: "With effect from 15 April 2026, an LTA exemption claim under {ref:#12.1} is accepted where the journey was undertaken during a spell of Earned Leave of at least 3 Working Days, instead of 5 Working Days as stated in {ref:#12.2}. The spell may include Casual Leave combined with Earned Leave as permitted by the Leave Policy."
