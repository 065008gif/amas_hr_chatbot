  - id: D
    title: Frequently Asked Questions for New Joiners
    body:
      - clause: "D.1"
        title: When will I receive my first salary?
        text: "Salary for the month of joining is paid on the last Working Day of that month if joining formalities, including bank details, are completed on the NPP by the 20th. Otherwise it is paid with the salary of the following month."
      - clause: "D.2"
        title: Can I take leave during probation?
        text: "Casual Leave and Sick Leave can be taken from joining. Earned Leave accrues from joining but can be availed only after three months of service, except in an emergency approved by the HR Business Partner, as provided in the Leave Policy."
      - clause: "D.3"
        title: When is my health insurance active?
        text: "From the date of joining, provided the dependants' details are entered on the NPP within 30 days. Dependants added later are covered only from the next policy renewal on 1 July, except a newborn or a new spouse added within 30 days of the event."
      - clause: "D.4"
        title: Can I work from home from my first week?
        text: "Hybrid work is available once the Reporting Manager confirms that the role permits it. Most new joiners work from the Base Location for the first four weeks to complete induction and meet the team."
      - clause: "D.5"
        title: Who do I ask if two policies seem to say different things?
        text: "Apply the policy hierarchy in {ref:#1.3}, and raise a ticket in the Policy Clarification category if still in doubt. The HR Helpdesk will confirm which rule applies and cite the governing clause."

      - clause: "D.6"
        title: I have a job offer from a client of Nexora. Can I accept it?
        text: "Most client contracts restrict the hiring of the Company's Employees for a period after deployment. Before accepting, speak to the HR Business Partner; the restrictions, and the non-solicitation obligations that apply after leaving, are described in the Separation and Exit Policy."
      - clause: "D.7"
        title: Can I change my tax regime during the year?
        text: "The tax regime chosen in April is applied for monthly deductions for the year. Salaried Employees may generally choose a different regime when filing their own income tax return, but the Company cannot change the regime used for deductions after the April declaration window, except for a new joiner who declares within 30 days of joining."
      - clause: "D.8"
        title: How do I get a laptop replaced or upgraded?
        text: "Raise a request with the IT Service Desk. Laptops are replaced every four years, or earlier if a fault cannot be repaired. Personal software may not be installed; approved software is available from the software centre on the laptop."
      - clause: "D.9"
        title: What happens to my insurance when I leave?
        text: "Group medical cover ends on the last day of service. The insurer offers a conversion to an individual policy without fresh waiting periods if the request is made within 30 days of leaving; details are in the exit kit on the NPP."
      - clause: "D.10"
        title: I am being asked to work very late every day. What should I do?
        text: "Discuss workload with the Reporting Manager first. If the pattern continues, raise it with the HR Business Partner or through the grievance process in {ref:#13.2}. Employees in Grades L1 to L3 may be entitled to overtime payment under the Attendance, Hybrid Work and Overtime Policy."
      - clause: "D.11"
        title: Can my spouse also work at Nexora?
        text: "Yes. Relatives may be employed, but an Employee may not be in the reporting line of a relative, or take part in decisions about the relative's hiring, pay, rating or promotion. The relationship must be declared on the NPP under the conflict of interest declaration."
      - clause: "D.12"
        title: Do I get paid for working on a Saturday?
        text: "Weekend work requires prior approval. Employees in Grades L1 to L4 may receive compensatory off under the Leave Policy, and those in Grades L1 to L3 may be eligible for overtime under the Attendance, Hybrid Work and Overtime Policy. Employees in Grades L5 and above are not eligible for either."
      - clause: "D.13"
        title: What if I lose my identity card?
        text: "Report the loss the same day to Facilities and the IT Service Desk so that the card can be deactivated. A temporary card is issued at the security desk against photo identification. A replacement fee of Rs. 500 is recovered for a second loss within 12 months."
      - clause: "D.14"
        title: Can I choose which project I work on?
        text: "Project allocation depends on client needs and skills. Employees can record preferences and skills on the NPP talent profile, which resource managers consult first. After 12 months on a project, an Employee may request a change, which the resource management team considers within 60 days."
      - clause: "D.15"
        title: How do I report an unsafe condition in the office?
        text: "Report it on the Facilities module of the NPP or to the security desk. Hazards such as exposed wiring, blocked fire exits or water leakage are attended to on the same day, and the reporter receives an update when the issue is closed."
