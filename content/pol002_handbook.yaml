  - id: G
    title: Illustrative Workplace Scenarios
    body:
      - para: "The scenarios below show how the values and policies apply in everyday situations. They are illustrations only; the governing policies decide any actual case."
      - clause: "G.1"
        title: A vendor offers a festival hamper
        text: "A vendor whose contract Priya manages sends a large festival hamper to her home. Priya should check the value against the gift limit in the Code of Conduct and Ethics, declare it on the NPP, and return it if it exceeds the limit or if a contract decision involving the vendor is pending. Accepting it silently would create at least the appearance of a conflict of interest."
      - clause: "G.2"
        title: A colleague asks for your login
        text: "A teammate who has lost access asks Arjun for his password to finish an urgent client delivery. Arjun must refuse, even though the request is well meant, and help the colleague raise an urgent request with the IT Service Desk. Every action on a system is attributed to the account holder."
      - clause: "G.3"
        title: A client manager makes repeated personal comments
        text: "A client's manager repeatedly comments on Meena's appearance during calls. Meena may raise a complaint with the Company's Internal Committee even though the person is not a Company Employee, as described in {ref:#20.3}. She may also speak confidentially to the HR Business Partner first."
      - clause: "G.4"
        title: A friend at a competitor asks about a client
        text: "Rahul's friend, who works for a competitor, asks which bank Rahul's project is for and how many people are on it. This is confidential client information, and Rahul should politely decline to discuss it."
      - clause: "G.5"
        title: A manager discourages leave
        text: "A Reporting Manager tells a team member that taking paternity leave during a release would affect his rating. This is contrary to the Leave Policy, which protects Employees who avail leave to which they are entitled. The team member may raise the matter with the HR Business Partner or through the grievance process."
      - clause: "G.6"
        title: Posting about a project win
        text: "Kiran wants to post on a professional networking site that the team has gone live for a well-known retailer. Client names may be mentioned publicly only where the client has agreed and Corporate Communications has approved; otherwise the post should describe the work without naming the client."
  - id: H
    title: Directory of HR Policies
    body:
      - para: "The following policies govern employment at the Company. Each is published on the NPP with its amendment circulars; the most recent version prevails over any summary in this Handbook."
      - table:
          title: Policies and what they cover
          header: ["Policy", "Number", "Owner", "Covers"]
          widths: [2.4, 1.6, 1.8, 3.6]
          rows:
            - ["Leave Policy", "NTL/HR/POL/001", "Head, HR Operations", "Leave types and entitlements, accrual, encashment, holidays, leave approvals"]
            - ["Employee Handbook", "NTL/HR/POL/002", "Head, HR Operations", "Overview of employment, joining, probation, benefits, referral scheme, creche, relocation"]
            - ["Policy on Prevention of Sexual Harassment (POSH)", "NTL/HR/POL/003", "Presiding Officer, Internal Committee", "Complaints, inquiry process, timelines, interim relief, protection from retaliation"]
            - ["Code of Conduct and Ethics", "NTL/HR/POL/004", "Chief Ethics Officer", "Conflicts of interest, gifts, outside employment, insider trading, whistleblowing, discipline"]
            - ["Compensation and Benefits Policy", "NTL/HR/POL/005", "Head, Total Rewards", "Salary structure, provident fund, ESI, gratuity, variable pay, insurance, ESOP"]
            - ["Attendance, Hybrid Work and Overtime Policy", "NTL/HR/POL/006", "Head, HR Operations", "Working hours, attendance, hybrid work, shifts, overtime, night transport"]
            - ["Travel and Expense Reimbursement Policy", "NTL/HR/POL/007", "Head, Finance Operations", "Travel class, hotels, per diem, local conveyance, claims and tax"]
            - ["Separation and Exit Policy", "NTL/HR/POL/008", "Head, HR Operations", "Resignation, notice periods, full and final settlement, relieving, non-solicitation"]
            - ["IT, Information Security and Acceptable Use Policy", "NTL/HR/POL/009", "Chief Information Security Officer", "Acceptable use, devices, passwords, client data, personal data protection, incidents"]

circulars_intro: "The circulars below amend this Handbook. Circulars that amend other policies are published at the end of those policies and are not repeated here; see {ref:#1.4}."

circulars:
  - number: HR/CIR/2025/09
    date: "2025-08-18"
    effective_from: "2025-09-01"
    subject: Revision of day-care reimbursement
    amends: ["8.2"]
    issued_by: Chief People Officer
    body:
      - para: "With effect from 1 September 2025, the reimbursement of day-care fees for Employees at Pune, Chennai and Noida under {ref:#8.2} is increased from Rs. 8,000 to Rs. 10,000 a month for each child, for up to two children aged six months to six years."
      - para: "The on-site creches at Bengaluru and Hyderabad are unchanged. An Employee at Bengaluru or Hyderabad who lives more than 15 kilometres from the campus may choose the reimbursement instead of the on-site creche, by declaration on the NPP once in each Leave Year."

  - number: HR/CIR/2026/01
    date: "2026-01-10"
    effective_from: "2026-01-15"
    subject: Eligibility for internal job postings
    amends: ["9.4"]
    issued_by: Chief People Officer
    body:
      - para: "With effect from 15 January 2026, an Employee may apply for an internal job posting after completing 9 months in the current role, instead of 12 months as stated in {ref:#9.4}. The other conditions, a most recent rating of 3 or above and not being on a performance improvement plan, continue to apply."
      - para: "Graduate Engineer Trainees in Grade L1 remain ineligible until 12 months after deployment to their first project."
