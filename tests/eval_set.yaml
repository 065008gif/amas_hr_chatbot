  - {id: T23, cat: circular, facts: [["no", "cannot", "not allowed", "not permitted"], ["anchor"]]}
  - {id: T24, cat: statute, facts: [["twice", "2 times", "double", "2x", "#3000"]]}
  - {id: T25, cat: grade, facts: [["none", "not eligible", "no shift allowance", "nil", "not entitled", "ineligible", "do not receive"], ["L1-L5", "L6-L8"]]}
  - {id: T26, cat: circular, facts: [["app-based cab", "app based cab", "cab", "uber"], ["hr/cir/2025/12", "circular"]]}
  - {id: T27, cat: grade, facts: [["rail", "train", "bus"], ["#500"]]}
  - {id: T28, cat: circular, facts: [["#6000"]]}
  - {id: T29, cat: conflict, facts: [["#45"]]}
  - {id: T30, cat: conflict, facts: [["#90"]]}
  - {id: T31, cat: circular, facts: [["50 per cent", "50%", "half", "#50"]]}
  - {id: T32, cat: statute, facts: [["#30"]]}
  - {id: T33, cat: circular, facts: [["withdrawn", "no longer", "not required", "do not need", "don't need", "not need"]]}
  - {id: T34, cat: circular, facts: [["no", "must not", "cannot", "prohibited", "not allowed", "not permitted"], ["hr/cir/2025/13", "circular", "public"]]}
