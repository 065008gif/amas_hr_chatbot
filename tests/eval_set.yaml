# =====================================================================================================
# Batch 2 (D-044). Multi-turn conversations: 3 turns each. The runner sends each turn with the history
# of the previous turns and the profile learned so far, exactly as the portal does. Turns are scored like
# single questions; a conversation is "fully correct" when all three turns are correct.
# Kinds: follow (elliptical follow-ups, F1), memory (a fact from 2 turns earlier is needed, F1),
# vague (vague or incomplete replies, F6), switch (topic change).
conversations:
  - id: M01
