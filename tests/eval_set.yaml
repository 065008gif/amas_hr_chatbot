# Phase 7 answer-evaluation set (D-043). Run with tests/answer_eval.py; checked by tests/check_eval_set.py.
#
# Each item:
#   id, cat      category used in the per-category report
#   q            the question (trap items take q and the expected route from tests/traps.json)
#   route        expected route, or a list of acceptable routes. POSH process questions are routed to
#                "escalate" by the safety screen and still get a cited process answer, so they accept both.
#   facts        gold facts: a list of groups; a group is satisfied when ANY of its alternatives appears in
#                the answer. "#90" means the number 90 (also matches "ninety", "90", "Rs. 90"); other
#                alternatives are matched as whole words, case-insensitive, commas in numbers ignored,
#                "L1 to L4" / "L1-L4" treated alike. All groups -> correct; some -> partly correct.
#   evidence     where the fact is written: {doc, page, quote}. The checker confirms each quote is on that
#                PDF page, and that every gold fact group can be found in the evidence documents.
#   absent       (unanswerable items) terms that must appear in NO chunk of the index, so the label is
#                verified rather than assumed.
#   profile      optional {grade, location} sent with the question. Items without it have no profile.
#
# The 36 traps are the held-out TEST questions of Phase 4. The other questions were written for this
# evaluation from the PDFs; none of them is from the Phase 4 development set (tests/retrieval_dev.yaml).

singles:
