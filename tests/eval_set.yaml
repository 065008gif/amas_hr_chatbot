  - {id: T02, cat: circular, facts: [["yes", "can be prefixed", "may be prefixed", "can add", "may add", "allowed", "can combine", "may combine"], ["#10"]]}
  - {id: T03, cat: definition, facts: [["no", "not eligible", "not entitled", "does not", "not covered", "not available"], ["immediate family"]]}
  - {id: T04, cat: statute, facts: [["#26"]]}
  - {id: T05, cat: grade, facts: [["no", "not eligible", "cannot"], ["L3-L8", "L3"]]}
  - {id: T06, cat: grade, facts: [["postgraduate"], ["six months", "6 months"]]}
  - {id: T07, cat: grade, facts: [["no", "not eligible", "not entitled"], ["L1-L4"]]}
  - {id: T08, cat: unanswerable}
  - {id: T09, cat: conflict, facts: [["#10"], ["hr/cir/2025/07", "circular"]]}
  - {id: T10, cat: grade, facts: [["not eligible", "no referral bonus", "none", "not entitled"]]}
  - {id: T11, cat: circular, facts: [["#10000"]]}
  - {id: T12, cat: unanswerable}
  - {id: T13, cat: circular, route: [answer, escalate], facts: [["yes", "can file", "may file", "can make", "may make", "extends", "extended"], ["8 march 2026", "hr/cir/2026/04"]]}
  - {id: T14, cat: definition, route: [answer, escalate], facts: [["yes", "applies", "covered", "does apply"], ["messaging"]]}
  - {id: T15, cat: circular, facts: [["no", "cannot", "not accept", "may not", "must not", "not allowed", "not permitted"], ["gift card", "gift cards"]]}
  - {id: T16, cat: conflict, route: [answer, escalate], facts: [["three months", "3 months", "three-month"]]}
  - {id: T17, cat: grade, facts: [["designated person", "designated persons"]]}
  - {id: T18, cat: definition, facts: [["yes", "must declare", "need to declare", "required to declare", "should declare"], ["relative", "relatives"]]}
  - {id: T19, cat: circular, facts: [["#400000", "4 lakh"]]}
  - {id: T20, cat: definition, facts: [["no", "not a metro", "not treated", "is not"], ["40 per cent", "40%", "#40"]]}
  - {id: T21, cat: grade, facts: [["no", "not eligible", "will not", "won't", "not be paid"], ["payout date", "on the rolls", "resigned", "resign"]]}
