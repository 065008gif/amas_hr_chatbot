# Phase 4 DEVELOPMENT set for retrieval: used to tune the retriever, separately from the traps
# (tests/traps.json), which are reported as the held-out TEST set.
#
# answerable: a chunk is "gold" if it belongs to `doc` and contains `quote` (exact text, whitespace
#             normalised). A question may list several acceptable golds (any one counts as a hit).
# unanswerable: questions the documents do not answer. `absent` lists terms that must appear in NO
#             chunk (checked by tests/retrieval_eval.py) so the label is verified, not assumed.
# followups:  multi-turn cases for the follow-up rewriter.

